version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ediv_db
      POSTGRES_USER: ediv_user
      POSTGRES_PASSWORD: ediv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ediv_user -d ediv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=ediv_portal.settings
      - PYTHONPATH=/app/backend
      - DATABASE_URL=postgresql://ediv_user:ediv_password@db:5432/ediv_db
      - REDIS_URL=redis://redis:6379
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1

volumes:
  postgres_data:
