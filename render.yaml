services:
  - type: web
    name: ediv-portal
    runtime: python
    plan: free
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_admin && (python manage.py seed_departments; python manage.py seed_schools; python manage.py seed_users; true) && gunicorn ediv_portal.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 180
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ediv_portal.settings
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: DATABASE_URL
        fromDatabase:
          name: ediv-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "ediv-portal.onrender.com,localhost,127.0.0.1"
      - key: REDIS_URL
        sync: false
      - key: KORA_PAY_PUBLIC_KEY
        sync: false
      - key: KORA_PAY_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TG_PASSWORD
        sync: false
      - key: HEAD_OFFICE_PASSWORD
        sync: false
      - key: SCHOOL_STAFF_PASSWORD
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://ediv-frontend-static.onrender.com
    healthCheckPath: /health/
    autoDeploy: true

databases:
  - name: ediv-db
    plan: free
    databaseName: education_district_iv
    ipAllowList: []
