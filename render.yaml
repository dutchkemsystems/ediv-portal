services:
  - type: web
    name: ediv-portal
    runtime: python
    plan: free
    buildCommand: |
      cd /opt/render/project/src && pip install --no-cache-dir -r requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd /opt/render/project/src/backend && python manage.py migrate --noinput && python manage.py ensure_admin && (python manage.py seed_departments & python manage.py seed_schools & python manage.py seed_users &) && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 180
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: DATABASE_URL
        fromDatabase:
          name: ediv-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "ediv-portal.onrender.com,localhost,127.0.0.1"
      - key: REDIS_URL
        sync: false
      - key: KORA_PAY_PUBLIC_KEY
        sync: false
      - key: KORA_PAY_SECRET_KEY
        sync: false
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "EDIV Portal <noreply@ediv.gov.ng>"
      - key: ADMIN_PASSWORD
        sync: false
      - key: TG_PASSWORD
        sync: false
      - key: HEAD_OFFICE_PASSWORD
        sync: false
      - key: SCHOOL_STAFF_PASSWORD
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: "https://ediv-frontend-static.onrender.com"
      - key: CLOUDINARY_URL
        sync: false
    healthCheckPath: /health/
    autoDeploy: true

  - type: static
    name: ediv-frontend-static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://ediv-portal.onrender.com/api"

cron:
  - name: wake-up
    schedule: "*/10 * * * *"
    command: "curl -s https://ediv-portal.onrender.com/wake/ || true"
    envVars:
      - key: URL
        value: "https://ediv-portal.onrender.com/wake/"

databases:
  - name: ediv-db
    plan: free
    databaseName: education_district_iv
    ipAllowList: []
