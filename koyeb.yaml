name: ediv-portal
type: web
regions:
  - fra
git:
  repository: github.com/dutchkemsystems/ediv-portal
  branch: main
  dockerfile:
    dockerfile: Dockerfile
ports:
  - port: 8000
    protocol: http
routes:
  - path: /
    port: 8000
health_checks:
  - port: 8000
    path: /api/health/
    health: true
scalings:
  - min: 1
    max: 1
instance_types:
  - type: micro
env:
  - key: PORT
    value: "8000"
  - key: DJANGO_ALLOWED_HOSTS
    value: ".koyeb.app"
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
  - key: FRONTEND_URL
    value: https://ediv-portal.koyeb.app
  - key: REGISTRY_AUTO_TASK
    value: "true"
  - key: VITE_REGISTRY_AUTO_TASK
    value: "true"