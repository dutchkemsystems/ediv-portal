global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'django'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Requires redis_exporter to be running alongside Redis.
  # Uncomment when redis_exporter is configured.
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']

  # Requires postgres_exporter to be running alongside PostgreSQL.
  # Uncomment when postgres_exporter is configured.
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres:5432']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  - 'alert_rules.yml'
